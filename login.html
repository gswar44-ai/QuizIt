<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Quiz It</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">
                🧠
            </div>

            <h1>
                Welcome to Quiz It
            </h1>

            <p>
                Login to continue your quiz journey.
            </p>

            <form id="loginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

                <button
                    type="submit"
                    class="primary-btn">

                    🔐 Login

                </button>

            </form>

            <p id="loginMessage"></p>

            <button
                class="back-btn"
                onclick="location.href='index.html'">

                ← Back to Quiz It

            </button>

        </div>

    </main>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
            document.getElementById("loginEmail").value;

        const password =
            document.getElementById("loginPassword").value;

        if (!email || !password) {

            return;

        }

        localStorage.setItem(
            "quizItUser",
            email
        );

        document.getElementById(
            "loginMessage"
        ).textContent =
            "✅ Login successful!";

        setTimeout(function() {

            location.href = "index.html";

        }, 800);

    });

</script>

</body>

</html>
